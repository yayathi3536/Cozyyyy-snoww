<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozyyyy-snoww</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            padding: 40px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .snowflake {
            font-size: 2em;
            margin: 20px 0;
        }
        
        .links {
            margin-top: 30px;
        }
        
        a {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 5px;
            text-decoration: none;
            transition: background 0.3s;
        }
        
        a:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cozyyyy-snoww ❄️</h1>
        <div class="snowflake">❄️ ☃️ ❄️</div>
        <p>Welcome to Cozyyyy-snoww</p>
        <p>A cozy winter-themed project with a touch of snow and warmth.</p>
        
        <div class="links">
            <a href="https://github.com/yayathi3536/Cozyyyy-snoww" target="_blank">View on GitHub</a>
        </div>
    </div>
</body>
</html>
